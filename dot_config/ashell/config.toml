[modules]
left = [ [ "Updates", "Workspaces" ] ]
center = [ "WindowTitle", "MediaPlayer" ]
right = [ "SystemInfo", [ "Tray", "Tempo", "Privacy", "Settings" ] ]

[updates]
check_cmd = "checkupdates; paru -Qua"
update_cmd = 'kitty -e bash -c "paru; echo Done - Press enter to exit; read" &'
interval = 3600

[appearance]
font_name = "Geist"
primary_color = "#7aa2f7"
success_color = "#9ece6a"
text_color = "#a9b1d6"

workspace_colors = [ "#ffb454" ]
scale_factor = 1.4
opacity = 0.9

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"

[appearance.secondary_color]
base = "#0c0d14"

[workspaces]
visibility_mode = "MonitorSpecific"

[settings]
microphone_indicator_format = "IconAndPercentage"
audio_indicator_format = "IconAndPercentage"
